{% extends 'base.html' %}
{% block title %}Sign In · GymHub{% endblock %}

{% block content %}
<div class="mt-10 max-w-sm mx-auto">

    <div class="text-center mb-8">
        <div class="inline-flex h-14 w-14 rounded-2xl bg-gradient-to-tr from-primary-500 to-fuchsia-500 items-center justify-center shadow-lg shadow-primary-500/30 mb-4">
            <span class="text-xl font-black">GH</span>
        </div>
        <h1 class="text-xl font-bold text-slate-100">Welcome back</h1>
        <p class="text-xs text-slate-500 mt-1">Sign in to GymHub</p>
    </div>

    <div class="rounded-2xl border border-white/5 bg-slate-900 p-6">
        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div class="mb-4 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-xs text-red-300">
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Username</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
                    class="w-full rounded-xl border border-white/10 bg-slate-800 px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-primary-500/60 focus:ring-1 focus:ring-primary-500/30 transition-colors"
                    value="{{ form.username.value|default:'' }}">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
                <input type="password" name="password" autocomplete="current-password"
                    class="w-full rounded-xl border border-white/10 bg-slate-800 px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-primary-500/60 focus:ring-1 focus:ring-primary-500/30 transition-colors">
            </div>

            <button type="submit"
                class="w-full rounded-xl bg-primary-600 hover:bg-primary-500 text-white text-sm font-semibold py-2.5 transition-colors shadow-lg shadow-primary-500/20">
                Sign In
            </button>

            <div class="flex items-center gap-3 my-4">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-xs text-slate-600">or</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <a href="{% url 'google_login' %}"
                class="w-full flex items-center justify-center gap-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-200 text-sm font-medium py-2.5 transition-colors">
                <svg class="h-4 w-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </a>
        </form>
    </div>
</div>
{% endblock %}
